# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Teaser

# Description for Canvas library panel.
description: A teaser component for content previews.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Group for organization in Canvas sidebar.
group: Content

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  properties:
    class:
      type: string
      title: CSS Classes
      description: Additional CSS classes for the teaser wrapper.
      examples: ['teaser--featured']

# Slots always hold arbitrary markup. We know that beforehand, so no need for
# a schema for slots.
slots:
  content:
    title: Content
    description: The main teaser content.
  image:
    title: Image
    description: Teaser image area.
  meta:
    title: Meta
    description: Teaser meta information (date, author, etc.).
  prefix:
    title: Prefix
    description: Content before the teaser (contextual links, etc.).
  title:
    title: Title
    description: Teaser title content.
