# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Container

# Description for Canvas library panel.
description: A flexible container component with customizable background and layout options.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Group for organization in Canvas sidebar.
group: Layout

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  properties:
    html_tag:
      type: string
      title: HTML Tag
      description: The HTML element to use for the container.
      enum:
        - section
        - div
        - article
        - aside
        - header
        - footer
        - main
      meta:enum:
        section: Section
        div: Div
        article: Article
        aside: Aside
        header: Header
        footer: Footer
        main: Main
      examples: ['section']
    background_image:
      type: string
      title: Background Image
      description: URL for a background image.
      format: uri-reference
      examples: ['']
    background_color:
      type: string
      title: Background Color
      description: CSS color value for the background.
      examples: ['']
    full_width:
      type: boolean
      title: Full Width
      description: Whether the container spans full viewport width.
      examples: [false]
    container:
      type: boolean
      title: Use Container
      description: Whether to wrap content in a Bootstrap container.
      examples: [true]

# Slots always hold arbitrary markup. We know that beforehand, so no need for
# a schema for slots.
slots:
  content:
    title: Content
    description: The main content of the container.
