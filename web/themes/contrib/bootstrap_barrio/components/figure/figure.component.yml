# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Figure

# Description for Canvas library panel.
description: A Bootstrap figure component for images with captions.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Group for organization in Canvas sidebar.
group: Media

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  properties:
    image_url:
      type: string
      title: Image URL
      description: URL of the figure image.
      format: uri-reference
      examples: ['https://placehold.co/400x300']
    caption:
      type: string
      title: Caption
      description: Caption text for the figure.
      examples: ['A caption for the above image.']
    rounded:
      type: boolean
      title: Rounded Borders
      description: Whether to apply rounded corners to the image.
      examples: [false]

# Slots always hold arbitrary markup. We know that beforehand, so no need for
# a schema for slots.
slots:
  image:
    title: Image
    description: Slot for custom image content.
