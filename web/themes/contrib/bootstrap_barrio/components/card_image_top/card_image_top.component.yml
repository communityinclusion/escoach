# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Card Image Top

# Description for Canvas library panel.
description: A Bootstrap card with an image positioned at the top.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Group for organization in Canvas sidebar.
group: Content

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  properties:
    card_image:
      type: string
      title: Card Image
      description: URL of the top image.
      format: uri-reference
      examples: ['https://placehold.co/400x200']
    card_tag:
      type: string
      title: Card Tag
      description: Tag or category label for the card.
      examples: ['News']
    card_title:
      type: string
      title: Card Title
      description: The main title of the card.
      examples: ['Card Title']
    card_body:
      type: string
      title: Card Body
      description: The body content below the image.
      contentMediaType: text/html
      examples: ['<p>Card body content.</p>']
