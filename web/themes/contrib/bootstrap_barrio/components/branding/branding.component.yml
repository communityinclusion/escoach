# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Branding

# Description for Canvas library panel.
description: Site branding component with logo, name, and slogan.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Use this key to organize components together.
group: Navigation

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  # Props are always an object with keys. Each key is a variable in your
  # component template.
  type: object

  properties:
    site_logo:
      type: string
      format: uri-reference
      title: Site Logo
      description: URL to the site logo image.
      examples: ['/themes/custom/mytheme/logo.svg']
    url:
      type: string
      title: Branding URL
      description: URL for the branding link (usually homepage).
      format: uri-reference
      examples: ['/']
    site_name:
      type: string
      title: Site Name
      description: The name of the site.
      examples: ['My Drupal Site']
    site_slogan:
      type: string
      title: Site Slogan
      description: The slogan or tagline of the site.
      examples: ['Building the future of the web']
