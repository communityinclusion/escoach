# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Toast

# Description for Canvas library panel.
description: A Bootstrap toast notification component.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Group for organization in Canvas sidebar.
group: Feedback

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  properties:
    title:
      type: string
      title: Toast Title
      description: The title displayed in the toast header.
      examples: ['Notification']
    autohide:
      type: boolean
      title: Auto Hide
      description: Whether the toast should automatically hide.
      examples: [true]
    delay:
      type: integer
      title: Delay
      description: Delay in milliseconds before auto-hiding.
      examples: [5000]

# Slots always hold arbitrary markup. We know that beforehand, so no need for
# a schema for slots.
slots:
  content:
    title: Content
    description: The main toast content.
  image:
    title: Image
    description: Toast header image or icon.
  meta:
    title: Meta
    description: Additional meta information (timestamp, etc.).
  prefix:
    title: Prefix
    description: Content before the toast body.
