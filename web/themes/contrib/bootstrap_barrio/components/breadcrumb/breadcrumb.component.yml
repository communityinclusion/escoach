# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Breadcrumb

# Description for Canvas library panel.
description: A Bootstrap breadcrumb navigation component.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Group for organization in Canvas sidebar.
group: Navigation

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  properties:
    breadcrumb:
      type: array
      title: Breadcrumbs
      description: Breadcrumb navigation items.
      items:
        type: object
        title: Breadcrumb Item
        properties:
          url:
            type: string
            title: URL
            format: uri-reference
            description: Link URL for the breadcrumb item.
            examples: ['/']
          text:
            type: string
            title: Text
            description: Display text for the breadcrumb item.
            examples: ['Home']
      examples:
        - - url: '/'
            text: 'Home'
          - url: '/products'
            text: 'Products'
          - url: ''
            text: 'Current Page'