# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Menu

# Description for Canvas library panel.
description: A navigation menu component.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Group for organization in Canvas sidebar.
group: Navigation

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  properties:
    items:
      type: array
      title: Menu Items
      description: List of menu links.
      items:
        type: object
        title: Menu Item
        properties:
          url:
            type: [string, object]
            title: URL
            format: uri-reference
            examples: ['/page']
          title:
            type: string
            title: Title
            examples: ['Page Link']
          below:
            type: array
            title: Submenu
            items:
              type: object
      examples:
        - - url: '/'
            title: 'Home'
          - url: '/about'
            title: 'About'
          - url: '/contact'
            title: 'Contact'
