# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Card Media

# Description for Canvas library panel.
description: A media-focused Bootstrap card for displaying images with content.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Group for organization in Canvas sidebar.
group: Media

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  properties:
    card_image:
      type: string
      title: Card Image
      description: URL of the media image.
      format: uri-reference
      examples: ['https://placehold.co/600x400']
    card_tag:
      type: string
      title: Card Tag
      description: Tag or category label for the media card.
      examples: ['Gallery']
    card_title:
      type: string
      title: Card Title
      description: The title of the media card.
      examples: ['Media Title']
    card_body:
      type: string
      title: Card Body
      description: The body content of the media card.
      contentMediaType: text/html
      examples: ['<p>Media description.</p>']
