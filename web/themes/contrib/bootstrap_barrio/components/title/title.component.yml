# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Title

# Description for Canvas library panel.
description: A configurable title component with customizable HTML tag.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Group for organization in Canvas sidebar.
group: Typography

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  required:
    - label
  properties:
    label:
      type: string
      title: Title Text
      description: The text content of the title.
      examples: ['Page Title']
    html_tag:
      type: string
      title: HTML Tag
      description: The HTML element to use for the title.
      enum:
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6
        - span
      meta:enum:
        h1: Heading 1
        h2: Heading 2
        h3: Heading 3
        h4: Heading 4
        h5: Heading 5
        h6: Heading 6
        span: Span
      examples: ['h2']

# Slots for arbitrary markup.
slots:
  title_prefix:
    title: Title Prefix
    description: Content to display before the title.
  title_suffix:
    title: Title Suffix
    description: Content to display after the title.
