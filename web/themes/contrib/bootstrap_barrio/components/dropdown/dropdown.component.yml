# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Dropdown

# Description for Canvas library panel.
description: A Bootstrap dropdown menu component.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Group for organization in Canvas sidebar.
group: Navigation

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  properties:
    dropdown_text:
      type: string
      title: Dropdown Text
      description: The text shown on the dropdown toggle button.
      examples: ['Menu']
    items:
      type: array
      title: Dropdown Items
      description: List of items in the dropdown menu.
      items:
        type: object
        title: Dropdown Item
        properties:
          url:
            type: string
            title: URL
            description: Link URL for the dropdown item.
            format: uri-reference
            examples: ['/page']
          text:
            type: string
            title: Text
            description: Display text for the dropdown item.
            examples: ['Menu Item']
      examples:
        - - url: '/action-1'
            text: 'Action'
          - url: '/action-2'
            text: 'Another action'
          - url: '/action-3'
            text: 'Something else'

# Slots always hold arbitrary markup. We know that beforehand, so no need for
# a schema for slots.
slots:
  dropdown_button:
    title: Dropdown Button
    description: Custom button content for the dropdown toggle.
  dropdown_menu:
    title: Dropdown Menu
    description: Custom menu content for the dropdown.
