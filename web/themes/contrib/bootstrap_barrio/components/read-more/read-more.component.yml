# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Read More

# Description for Canvas library panel.
description: A read more link component with accessibility support.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Group for organization in Canvas sidebar.
group: Actions

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  required:
    - url
  properties:
    url:
      type: string
      title: URL
      description: The link destination.
      format: uri-reference
      examples: ['/node/1']
    text:
      type: string
      title: Link Text
      description: The visible link text.
      examples: ['Read more']
    a11y:
      type: string
      title: Screen Reader Text
      description: Additional context for screen readers.
      examples: ['about this article']
