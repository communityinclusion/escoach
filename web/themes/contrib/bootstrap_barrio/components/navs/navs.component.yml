# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Navs

# Description for Canvas library panel.
description: A Bootstrap navs component for navigation styling.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Group for organization in Canvas sidebar.
group: Navigation

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  properties:
    alignment:
      type: string
      title: Alignment
      description: Navigation alignment and style.
      enum:
        - ''
        - justify-content-center
        - justify-content-end
        - flex-column
        - nav-tabs
        - nav-pills
      meta:enum:
        '': Default (Left)
        justify-content-center: Center
        justify-content-end: Right
        flex-column: Vertical
        nav-tabs: Tabs Style
        nav-pills: Pills Style
      examples: ['']
    items:
      type: array
      title: Navigation Items
      description: List of navigation links.
      items:
        type: object
        title: Navigation Item
        properties:
          url:
            type: string
            title: URL
            format: uri-reference
            examples: ['/page']
          title:
            type: string
            title: Title
            examples: ['Link']
          active:
            type: boolean
            title: Active
            examples: [false]
      examples:
        - - url: '#'
            title: 'Active'
            active: true
          - url: '#'
            title: 'Link'
          - url: '#'
            title: 'Another Link'
