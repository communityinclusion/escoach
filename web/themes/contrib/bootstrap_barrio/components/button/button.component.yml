# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Button

# Description for Canvas library panel.
description: A Bootstrap button component with various styles.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Group for organization in Canvas sidebar.
group: Actions

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  required:
    - text
  properties:
    text:
      type: string
      title: Text
      description: The button label text.
      examples: ['Click me']
    url:
      type: string
      title: URL
      description: The URL the button links to.
      format: uri-reference
      examples: ['/contact']
    variant:
      type: string
      title: Variant
      description: The color variant of the button.
      enum:
        - primary
        - secondary
        - success
        - danger
        - warning
        - info
        - light
        - dark
        - link
        - outline-primary
        - outline-secondary
        - outline-success
        - outline-danger
        - outline-warning
        - outline-info
        - outline-light
        - outline-dark
      meta:enum:
        primary: Primary
        secondary: Secondary
        success: Success
        danger: Danger
        warning: Warning
        info: Info
        light: Light
        dark: Dark
        link: Link
        outline-primary: Outline Primary
        outline-secondary: Outline Secondary
        outline-success: Outline Success
        outline-danger: Outline Danger
        outline-warning: Outline Warning
        outline-info: Outline Info
        outline-light: Outline Light
        outline-dark: Outline Dark
      examples: ['primary']
    size:
      type: string
      title: Size
      description: The size of the button.
      enum:
        - ''
        - btn-lg
        - btn-sm
      meta:enum:
        '': Default
        btn-lg: Large
        btn-sm: Small
      examples: ['']
